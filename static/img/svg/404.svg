<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sombra de suelo desacoplada con caída óptica natural -->
    <symbol id="bookGroundShadow" viewBox="0 0 240 32">
      <!-- Capa exterior difusa -->
      <ellipse cx="120" cy="16" rx="98" ry="12" fill="currentColor" opacity="0.32" />
      <!-- Capa intermedia de penumbra -->
      <ellipse cx="120" cy="16" rx="72" ry="8" fill="currentColor" opacity="0.52" />
      <!-- Núcleo de oclusión bajo el lomo -->
      <ellipse cx="120" cy="16" rx="44" ry="4.5" fill="currentColor" opacity="0.8" />
    </symbol>

    <!-- Libro flotante: La Página Perdida con marca de agua 404 y partículas de papel -->
    <symbol id="missingPageBook" viewBox="0 0 240 160">
      <!-- Tapa dura exterior / Encuadernación con perspectiva curva -->
      <path d="M 22 130 C 58 130 96 136 120 144 C 144 136 182 130 218 130 C 223 130 226 126 226 121 L 226 31 C 226 26 222 24 218 24 C 180 24 140 30 120 38 C 100 30 60 24 22 24 C 18 24 14 26 14 31 L 14 121 C 14 126 17 130 22 130 Z" fill="currentColor" opacity="0.08" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />

      <!-- Bloque de hojas (grosor de papel en los cantos) -->
      <path d="M 24 126 C 58 126 96 132 118 140 L 118 36 C 96 28 58 22 24 22 Z" fill="currentColor" opacity="0.06" />
      <path d="M 216 126 C 182 126 144 132 122 140 L 122 36 C 144 28 182 22 216 22 Z" fill="currentColor" opacity="0.06" />

      <!-- Página izquierda (texto completo y presente) -->
      <path d="M 26 122 C 60 122 98 128 118 136 L 118 32 C 98 24 60 18 26 18 C 21 18 18 21 18 26 L 18 114 C 18 119 21 122 26 122 Z" fill="currentColor" opacity="0.12" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />

      <!-- Cabecera de capítulo en la página izquierda -->
      <rect x="36" y="32" width="28" height="4" rx="2" fill="var(--accentColor)" opacity="0.6" />
      <line x1="70" y1="34" x2="104" y2="34" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />

      <!-- Párrafos de la página izquierda con sangría editorial -->
      <line x1="48" y1="46" x2="104" y2="46" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />
      <line x1="36" y1="58" x2="102" y2="58" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.38" />
      <line x1="36" y1="70" x2="106" y2="70" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.38" />
      <line x1="36" y1="82" x2="94" y2="82" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.38" />
      <line x1="48" y1="96" x2="104" y2="96" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
      <line x1="36" y1="108" x2="80" y2="108" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.3" />

      <!-- Número de página inferior izquierdo -->
      <line x1="36" y1="118" x2="44" y2="118" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.25" />

      <!-- Página derecha (página incompleta con corte rasgado y marca de agua) -->
      <!-- Contorno de página derecha con borde desgarrado -->
      <path d="M 122 136 C 142 128 178 122 214 122 C 219 122 222 119 222 114 L 222 64 L 208 58 L 216 46 L 202 38 L 214 26 C 214 21 210 18 206 18 C 174 18 140 24 122 32 Z" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />

      <!-- Marca de agua editorial "404" grabada en la página perdida -->
      <text x="170" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="34" font-weight="900" letter-spacing="-1.5" text-anchor="middle" fill="currentColor" opacity="0.14">404</text>

      <!-- Líneas de texto que se desvanecen en la página derecha -->
      <line x1="136" y1="46" x2="178" y2="46" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.3" />
      <circle cx="188" cy="46" r="1.5" fill="currentColor" opacity="0.3" />
      <circle cx="196" cy="46" r="1.5" fill="currentColor" opacity="0.18" />

      <line x1="136" y1="96" x2="162" y2="96" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.25" />
      <circle cx="172" cy="96" r="1.5" fill="currentColor" opacity="0.2" />

      <line x1="136" y1="108" x2="150" y2="108" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.2" />
      <circle cx="158" cy="108" r="1.5" fill="currentColor" opacity="0.15" />

      <!-- Partículas de papel / fragmentos que flotan desprendidos -->
      <path d="M 218 36 L 225 34 L 223 41 L 216 40 Z" fill="var(--accentColor)" opacity="0.75" />
      <path d="M 226 52 L 232 50 L 230 56 Z" fill="currentColor" opacity="0.35" />
      <circle cx="212" cy="62" r="1.8" fill="var(--accentColor)" opacity="0.6" />
      <circle cx="228" cy="24" r="1.2" fill="var(--accentColor)" opacity="0.5" />

      <!-- Canal central del lomo y costura -->
      <line x1="120" y1="32" x2="120" y2="140" stroke="currentColor" stroke-width="2" opacity="0.3" />
      <line x1="118.5" y1="32" x2="118.5" y2="140" stroke="currentColor" stroke-width="1" opacity="0.15" />

      <!-- Cinta marcapáginas elegante en color de acento Kasnia -->
      <g class="bookmarkGroup">
        <!-- Caída de la cinta con suave curvatura -->
        <path d="M 114 30 Q 112 70 114 104 L 120 98 L 126 104 Q 128 70 126 30 Z" fill="var(--accentColor)" />
        <!-- Sombra sutil de la cinta sobre el pliegue del lomo -->
        <path d="M 120 30 L 126 30 Q 128 70 126 104 L 120 98 Z" fill="black" opacity="0.15" />
      </g>
    </symbol>

    <!-- Iconos complementarios para botones -->
    <symbol id="iconHome" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </symbol>

    <symbol id="iconBooks" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    </symbol>
  </defs>
</svg>
