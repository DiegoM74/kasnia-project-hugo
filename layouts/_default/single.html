{{ define "css" }}
  {{ $cssFile := resources.Get (printf "css/%s.css" .File.BaseFileName) }}
  {{ if $cssFile }}
    {{ $css := $cssFile | resources.Minify | resources.Fingerprint }}
    <link rel="stylesheet" href="{{ $css.Permalink }}">
  {{ end }}
{{ end }}

{{ define "main" }}
  {{ .Content }}
{{ end }}
